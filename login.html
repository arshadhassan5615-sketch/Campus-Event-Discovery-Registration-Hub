<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12243a">
  <meta name="description" content="Log in to CampusHub to find campus events and register.">
  <title>Log in | CampusHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <a class="brand" href="login.html"><span class="brand-mark">C</span><span>Campus<span class="brand-light">Hub</span></span></a>
    <h1>Log in</h1>
    <p class="panel-intro">Sign in to see campus events and register for a seat.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary auth-submit" type="submit">Log in</button>
    </form>

    <p class="note">Demo login: student / campus123</p>
  </main>

  <script src="login.js"></script>
</body>
</html>
