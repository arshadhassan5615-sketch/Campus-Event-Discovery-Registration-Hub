<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12243a">
  <meta name="description" content="Log in to CampusHub to find campus events and register.">
  <title>Log in | CampusHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <a class="brand" href="login.html"><span class="brand-mark">C</span><span>Campus<span class="brand-light">Hub</span></span></a>
    <h1 id="page-title">Log in</h1>
    <p class="panel-intro" id="page-intro">Sign in to see campus events and register for a seat.</p>

    <!-- Log in form (shown first) -->
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary auth-submit" type="submit">Log in</button>
    </form>

    <!-- Button that opens the create account form -->
    <div class="auth-switch" id="switch-to-signup">
      <p>New here?</p>
      <button class="btn secondary auth-submit" type="button" id="show-signup">Create account</button>
    </div>

    <!-- Create account form (hidden until the button is pressed) -->
    <form id="signup-form" novalidate hidden>
      <div class="field">
        <label for="signup-username">Choose a username</label>
        <input id="signup-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="signup-password">Password (at least 6 characters)</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required>
      </div>
      <p class="error" id="signup-error" role="alert"></p>
      <button class="btn primary auth-submit" type="submit">Create account and log in</button>
    </form>

    <div class="auth-switch" id="switch-to-login" hidden>
      <p>Already have an account?</p>
      <button class="auth-link" type="button" id="show-login">Back to log in</button>
    </div>

    <p class="note">Demo login: student / campus123</p>
  </main>

  <script src="login.js"></script>
</body>
</html>
